name: Feature request
description: Something the plugin should also do
labels: [enhancement]

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is slow, missing or awkward in your workflow today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What the plugin should do instead.
