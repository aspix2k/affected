name: Bug report
description: Something the plugin does wrong
labels: [bug]

body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: IDE name and build, operating system, plugin version. Help → About shows the first two.
      placeholder: |
        IDE: Android Studio 2026.1.3 (AI-261.26222.65)
        OS: macOS 15.6
        Plugin: 1.0.0
    validations:
      required: true

  - type: textarea
    id: project
    attributes:
      label: Project layout
      description: Composite build or single project, Kotlin or Groovy build scripts, roughly how many modules.

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant part of idea.log (Help → Show Log in Finder/Explorer). Remove anything private first.
      render: text
