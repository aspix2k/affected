name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0

      - name: Free disk space for the downloaded IDEs
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: The changelog must describe the current version
        id: version
        run: |
          version=$(./gradlew -q printVersion)
          .github/changelog-section.sh "$version" > /dev/null \
            || { echo "::error file=CHANGELOG.md::Add a section for $version before bumping the version."; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: ./gradlew detekt
      - run: ./gradlew test koverXmlReport buildPlugin
      - run: ./gradlew verifyPlugin

      - name: Record the verified plugin artifact
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(build/distributions/affected-*.zip)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one plugin archive, found ${#archives[@]}."
            exit 1
          fi

          archive=${archives[0]}
          archive_name=$(basename "$archive")
          sha256=$(sha256sum "$archive" | awk '{print $1}')
          source_tree=$(git rev-parse 'HEAD^{tree}')
          jq -n \
            --arg version "$PLUGIN_VERSION" \
            --arg archive "$archive_name" \
            --arg sha256 "$sha256" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg sourceTree "$source_tree" \
            '{version: $version, archive: $archive, sha256: $sha256, sourceCommit: $sourceCommit, sourceTree: $sourceTree}' \
            > build/distributions/release-metadata.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports
          path: |
            build/reports/tests
            build/reports/kover
            build/reports/pluginVerifier
          if-no-files-found: warn

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin
          path: |
            build/distributions/*.zip
            build/distributions/release-metadata.json
          if-no-files-found: error
