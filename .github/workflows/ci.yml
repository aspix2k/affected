name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plugin: ${{ steps.classify.outputs.plugin }}
      health: ${{ steps.classify.outputs.health }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        run: python3 scripts/ci_scope.py --github-output "$GITHUB_OUTPUT"

  scripts:
    name: Scripts and analyzers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Install pinned analyzers
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          SHELLCHECK_VERSION: 0.11.0
        run: |
          set -euo pipefail

          tools=$RUNNER_TEMP/affected-quality
          bin=$tools/bin
          mkdir -p "$bin"

          shellcheck_archive=$tools/shellcheck.tar.xz
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 \
            --output "$shellcheck_archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$shellcheck_archive" | sha256sum --check --strict
          tar --extract --xz --file "$shellcheck_archive" --directory "$tools"
          install -m 0755 "$tools/shellcheck-v$SHELLCHECK_VERSION/shellcheck" "$bin/shellcheck"

          actionlint_archive=$tools/actionlint.tar.gz
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 \
            --output "$actionlint_archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$actionlint_archive" | sha256sum --check --strict
          tar --extract --gzip --file "$actionlint_archive" --directory "$tools"
          install -m 0755 "$tools/actionlint" "$bin/actionlint"

          test -x "$bin/shellcheck"
          test -x "$bin/actionlint"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Require zero ShellCheck findings
        run: /usr/bin/time --verbose scripts/quality.sh shell

      - name: Require zero actionlint findings
        run: /usr/bin/time --verbose scripts/quality.sh workflows

      - name: Reject analyzer baselines and fail-open settings
        run: scripts/quality.sh analyzers

      - name: Test the release currentness gate
        run: python3 -m unittest scripts.tests.test_release_currentness

      - name: Require current release pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/time --verbose python3 scripts/release_currentness.py

      - name: Test the executable support matrix
        run: |
          python3 -m unittest scripts.tests.test_support_matrix
          python3 scripts/support_matrix.py --check

      - name: Test the executable MCP capability matrix
        run: |
          python3 -m unittest scripts.tests.test_mcp_capabilities
          python3 scripts/mcp_capabilities.py --check

      - name: Test pull-request CI contracts
        run: |
          python3 -m unittest scripts.tests.test_changelog_fragments scripts.tests.test_ci_contracts scripts.tests.test_ci_scope scripts.tests.test_docs_layout scripts.tests.test_fetch_gradle scripts.tests.test_local_gate scripts.tests.test_product_claims scripts.tests.test_run_gradle
          python3 scripts/ci_contracts.py --check

      - name: Pull requests must not edit the assembled changelog
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref || 'main' }}
        run: |
          set -euo pipefail
          base=${BASE_REF#refs/heads/}
          git fetch --no-tags origin "$base"
          python3 scripts/changelog_fragments.py check --base "origin/$base"

      - name: Test the PIT survivor gate
        run: python3 -m unittest scripts.tests.test_pitest_gate

      - name: The changelog must describe the current version
        run: |
          set -euo pipefail
          version=$(python3 -c 'import re, pathlib, sys
          text = pathlib.Path("build.gradle.kts").read_text(encoding="utf-8")
          match = re.search(r"(?m)^version = \"([^\"]+)\"", text)
          sys.exit("version is missing from build.gradle.kts") if match is None else print(match.group(1))')
          .github/changelog-section.sh "$version" > /dev/null \
            || { echo "::error file=docs/CHANGELOG.md::Add a section for $version before bumping the version."; exit 1; }

  plugin:
    name: Plugin verification
    needs: [scope]
    if: needs.scope.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0

      - name: Free disk space for the downloaded IDEs
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: The changelog must describe the current version
        id: version
        run: |
          set -euo pipefail
          version=$(python3 -c 'import re, pathlib, sys
          text = pathlib.Path("build.gradle.kts").read_text(encoding="utf-8")
          match = re.search(r"(?m)^version = \"([^\"]+)\"", text)
          sys.exit("version is missing from build.gradle.kts") if match is None else print(match.group(1))')
          .github/changelog-section.sh "$version" > /dev/null \
            || { echo "::error file=docs/CHANGELOG.md::Add a section for $version before bumping the version."; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Analyze, test, package and verify
        run: >-
          scripts/run_gradle.sh --no-daemon --max-workers=2
          detekt test koverXmlReport koverVerify buildPlugin verifyPlugin
          :collector:spotbugsMain :collector:spotbugsMaven

      - name: Record the verified plugin artifact
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(build/distributions/affected-*.zip)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one plugin archive, found ${#archives[@]}."
            exit 1
          fi

          archive=${archives[0]}
          archive_name=$(basename "$archive")
          sha256=$(sha256sum "$archive" | awk '{print $1}')
          source_tree=$(git rev-parse 'HEAD^{tree}')
          jq -n \
            --arg version "$PLUGIN_VERSION" \
            --arg archive "$archive_name" \
            --arg sha256 "$sha256" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg sourceTree "$source_tree" \
            '{version: $version, archive: $archive, sha256: $sha256, sourceCommit: $sourceCommit, sourceTree: $sourceTree}' \
            > build/distributions/release-metadata.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports
          path: |
            build/reports/tests
            build/reports/kover
            build/reports/pluginVerifier
            collector/build/reports/spotbugs
          if-no-files-found: warn

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin
          path: |
            build/distributions/*.zip
            build/distributions/release-metadata.json
          if-no-files-found: error

  health:
    name: Gradle dependency analysis
    needs: [scope]
    if: needs.scope.outputs.health == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0

      - name: Free disk space for the downloaded IDE
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Require zero dependency findings
        run: >-
          /usr/bin/time --verbose
          scripts/run_gradle.sh --no-daemon --no-parallel --max-workers=1
          :buildHealth

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: dependency-analysis-reports
          path: |
            build/reports/dependency-analysis
            collector/build/reports/dependency-analysis
            core/build/reports/dependency-analysis
            mcp/build/reports/dependency-analysis
          if-no-files-found: warn

  verify:
    name: verify
    if: ${{ always() }}
    needs: [scope, scripts, plugin, health]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every fast gate
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCRIPT_RESULT: ${{ needs.scripts.result }}
          PLUGIN_RESULT: ${{ needs.plugin.result }}
          HEALTH_RESULT: ${{ needs.health.result }}
          PLUGIN_REQUIRED: ${{ needs.scope.outputs.plugin }}
          HEALTH_REQUIRED: ${{ needs.scope.outputs.health }}
        run: |
          set -euo pipefail
          failed=0
          require_success() {
            local name=$1 result=$2
            if [ "$result" != success ]; then
              echo "::error::Required job $name finished as $result."
              failed=1
            fi
          }
          require_when() {
            local name=$1 required=$2 result=$3
            if [ "$required" = false ]; then
              if [ "$result" = success ] || [ "$result" = skipped ]; then
                return
              fi
              echo "::error::Optional job $name finished as $result."
              failed=1
              return
            fi
            require_success "$name" "$result"
          }
          require_success scope "$SCOPE_RESULT"
          require_success scripts "$SCRIPT_RESULT"
          require_when plugin "${PLUGIN_REQUIRED:-true}" "$PLUGIN_RESULT"
          require_when health "${HEALTH_REQUIRED:-true}" "$HEALTH_RESULT"
          exit "$failed"
