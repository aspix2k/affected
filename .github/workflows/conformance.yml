name: Exact-impact conformance

on:
  pull_request:
  merge_group:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Exact-impact scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      exact: ${{ steps.classify.outputs.exact }}
      native: ${{ steps.classify.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        run: python3 scripts/ci_scope.py --github-output "$GITHUB_OUTPUT"

  exact-impact:
    name: ${{ matrix.os }} / JDK ${{ matrix.java }}
    needs: [scope]
    if: needs.scope.outputs.exact == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: "17"
            gradle8: "true"
            symlinks: required
          - os: ubuntu-latest
            java: "26"
            gradle8: "false"
            symlinks: required
          - os: macos-latest
            java: "21"
            gradle8: "true"
            symlinks: required
          - os: windows-latest
            java: "21"
            gradle8: "true"
            symlinks: optional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run exact-impact fixtures
        shell: bash
        run: |
          scripts/run_gradle.sh :collector:test \
            --tests com.aspix2k.affected.collector.AffectedDependencySelectorTest \
            --tests com.aspix2k.affected.collector.AffectedMavenConfigTest \
            --tests com.aspix2k.affected.collector.CollectorContractTest \
            --tests com.aspix2k.affected.collector.GradleInjectionTest \
            --tests com.aspix2k.affected.collector.MavenInjectionTest \
            -Paffected.conformance=true \
            -Paffected.test.javaVersion=${{ matrix.java }} \
            -Paffected.test.gradle8=${{ matrix.gradle8 }} \
            -Paffected.test.symlinkMode=${{ matrix.symlinks }} \
            --rerun-tasks --no-daemon --no-parallel --max-workers=1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: exact-impact-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            collector/build/test-results/test
            collector/build/reports/tests/test
            collector/build/reports/exact-impact-conformance
          if-no-files-found: error

  cross-platform-paths:
    name: Cross-platform paths / ${{ matrix.os }}
    needs: [scope]
    if: needs.scope.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.os == 'Windows'
        with:
          python-version: "3.14.8"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run platform-specific core tests
        shell: bash
        run: >-
          scripts/run_gradle.sh :core:test
          --tests com.aspix2k.affected.CrossPlatformPathTest
          --tests com.aspix2k.affected.build.AffectedMixedRunNativeTest
          --tests com.aspix2k.affected.build.CliUnittestWindowsJunctionConformanceTest
          --tests com.aspix2k.affected.build.process.ContainedProcessTest
          --tests com.aspix2k.affected.build.process.SequentialProcessCancellationTest
          --tests com.aspix2k.affected.build.SwiftPmNativeTest
          --tests com.aspix2k.affected.build.xcode.XcodeNativeTest
          -Paffected.cliConformance=true
          --rerun-tasks --no-daemon --no-parallel --max-workers=1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cross-platform-paths-${{ matrix.os }}
          path: |
            core/build/test-results/test
            core/build/reports/tests/test
          if-no-files-found: warn

  cli-native:
    name: CLI native fixtures / Linux
    needs: [scope]
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_NEXTEST_VERSION: "0.9.146"
      CARGO_NEXTEST_SHA256: "682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428"
      BAZELISK_VERSION: "1.29.0"
      BAZELISK_SHA256: "5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992"
      SQLC_VERSION: "1.31.1"
      SQLC_SHA256: "497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354"
      BUN_VERSION: "1.4.2"
      BUN_SHA256: "36368faef7527875d5ffa52e53cd48021741f2a83eb6208a8dd64068d422a913"
      DENO_VERSION: "2.9.7"
      DENO_SHA256: "c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: sbt/setup-sbt@6158cb0903b8ceeae04f830055f3155e1b6a5ad7 # v1.5.11
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.10.0"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.401"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.99.0"
      - name: Install cargo-nextest
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CARGO_NEXTEST_VERSION" =~ ^0\.9\.[0-9]+$ ]]
          [[ "$CARGO_NEXTEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          archive="$RUNNER_TEMP/cargo-nextest.tar.gz"
          destination="$RUNNER_TEMP/cargo-nextest-bin"
          url="https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$CARGO_NEXTEST_VERSION/cargo-nextest-$CARGO_NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          curl -q --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 120 --max-filesize 33554432 \
            --retry 3 --retry-all-errors \
            --output "$archive" "$url"
          printf '%s  %s\n' "$CARGO_NEXTEST_SHA256" "$archive" | sha256sum --check --strict
          [[ "$(tar -tzf "$archive")" == "cargo-nextest" ]]
          [[ "$(tar -tvzf "$archive" | cut -c1)" == "-" ]]
          install -d -m 0700 "$destination"
          tar -xzf "$archive" --no-same-owner --no-same-permissions -C "$destination"
          [[ -f "$destination/cargo-nextest" && ! -L "$destination/cargo-nextest" ]]
          chmod 0755 "$destination/cargo-nextest"
          [[ "$("$destination/cargo-nextest" --version)" == "cargo-nextest $CARGO_NEXTEST_VERSION "* ]]
          printf '%s\n' "$destination" >> "$GITHUB_PATH"
      - name: Install Bazelisk
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BAZELISK_VERSION" =~ ^1\.[0-9]+\.[0-9]+$ ]]
          [[ "$BAZELISK_SHA256" =~ ^[0-9a-f]{64}$ ]]
          binary="$RUNNER_TEMP/bazelisk"
          destination="$RUNNER_TEMP/bazelisk-bin"
          url="https://github.com/bazelbuild/bazelisk/releases/download/v$BAZELISK_VERSION/bazelisk-linux-amd64"
          curl -q --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 120 --max-filesize 33554432 \
            --retry 3 --retry-all-errors \
            --output "$binary" "$url"
          printf '%s  %s\n' "$BAZELISK_SHA256" "$binary" | sha256sum --check --strict
          install -d -m 0700 "$destination"
          install -m 0755 "$binary" "$destination/bazelisk"
          ln -s bazelisk "$destination/bazel"
          [[ -x "$destination/bazelisk" && -x "$destination/bazel" ]]
          printf '%s\n' "$destination" >> "$GITHUB_PATH"
      - name: Install sqlc
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SQLC_VERSION" =~ ^1\.[0-9]+\.[0-9]+$ ]]
          [[ "$SQLC_SHA256" =~ ^[0-9a-f]{64}$ ]]
          archive="$RUNNER_TEMP/sqlc.tar.gz"
          destination="$RUNNER_TEMP/sqlc-bin"
          url="https://github.com/sqlc-dev/sqlc/releases/download/v$SQLC_VERSION/sqlc_${SQLC_VERSION}_linux_amd64.tar.gz"
          curl -q --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 120 --max-filesize 33554432 \
            --retry 3 --retry-all-errors \
            --output "$archive" "$url"
          printf '%s  %s\n' "$SQLC_SHA256" "$archive" | sha256sum --check --strict
          [[ "$(tar -tzf "$archive")" == "sqlc" ]]
          [[ "$(tar -tvzf "$archive" | cut -c1)" == "-" ]]
          install -d -m 0700 "$destination"
          tar -xzf "$archive" --no-same-owner --no-same-permissions -C "$destination"
          [[ -f "$destination/sqlc" && ! -L "$destination/sqlc" ]]
          chmod 0755 "$destination/sqlc"
          [[ "$("$destination/sqlc" version)" == "v$SQLC_VERSION" ]]
          printf '%s\n' "$destination" >> "$GITHUB_PATH"
      - name: Install Bun
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUN_VERSION" =~ ^1\.[0-9]+\.[0-9]+$ ]]
          [[ "$BUN_SHA256" =~ ^[0-9a-f]{64}$ ]]
          archive="$RUNNER_TEMP/bun.zip"
          destination="$RUNNER_TEMP/bun-bin"
          url="https://github.com/oven-sh/bun/releases/download/bun-v$BUN_VERSION/bun-linux-x64.zip"
          curl -q --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 120 --max-filesize 67108864 \
            --retry 3 --retry-all-errors \
            --output "$archive" "$url"
          printf '%s  %s\n' "$BUN_SHA256" "$archive" | sha256sum --check --strict
          [[ "$(unzip -Z1 "$archive" | grep -c '^bun-linux-x64/bun$')" == "1" ]]
          install -d -m 0700 "$destination"
          unzip -q -j "$archive" 'bun-linux-x64/bun' -d "$destination"
          [[ -f "$destination/bun" && ! -L "$destination/bun" ]]
          chmod 0755 "$destination/bun"
          [[ "$("$destination/bun" --version)" == "$BUN_VERSION" ]]
          printf '%s\n' "$destination" >> "$GITHUB_PATH"
      - name: Install Deno
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DENO_VERSION" =~ ^2\.[0-9]+\.[0-9]+$ ]]
          [[ "$DENO_SHA256" =~ ^[0-9a-f]{64}$ ]]
          archive="$RUNNER_TEMP/deno.zip"
          destination="$RUNNER_TEMP/deno-bin"
          url="https://github.com/denoland/deno/releases/download/v$DENO_VERSION/deno-x86_64-unknown-linux-gnu.zip"
          curl -q --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 120 --max-filesize 67108864 \
            --retry 3 --retry-all-errors \
            --output "$archive" "$url"
          printf '%s  %s\n' "$DENO_SHA256" "$archive" | sha256sum --check --strict
          [[ "$(unzip -Z1 "$archive")" == "deno" ]]
          install -d -m 0700 "$destination"
          unzip -q "$archive" -d "$destination"
          [[ -f "$destination/deno" && ! -L "$destination/deno" ]]
          chmod 0755 "$destination/deno"
          [[ "$("$destination/deno" --version | head -n 1)" == "deno $DENO_VERSION "* ]]
          printf '%s\n' "$destination" >> "$GITHUB_PATH"
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # master
        with:
          ruby-version: "4.0.7"
          bundler: "4.0.22"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5.11"
          extensions: dom, mbstring, xml, xmlwriter
          tools: composer:2.10.3
          coverage: none
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: "3.13.0"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.0"
          channel: stable

      - name: Install native fixture tools
        run: |
          python -m pip install cmake==4.4.3 pytest==9.1.1 ruff==0.16.9 uv==0.12.21
          sudo timeout --kill-after=30s 2m apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::ForceIPv4=true update
          sudo timeout --kill-after=30s 15m apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::ForceIPv4=true install -y --no-install-recommends ant ant-optional meson ninja-build gcc make r-base r-cran-testthat

      - name: Check Python adapters
        run: |
          python -m ruff check core/src/main/python
          python -m ruff format --check core/src/main/python

      - name: Run native CLI fixtures
        run: >-
          scripts/run_gradle.sh :core:test
          --tests '*Cli*ConformanceTest'
          -Paffected.cliConformance=true
          --rerun-tasks --no-daemon --no-parallel --max-workers=1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cli-native-linux
          path: |
            core/build/test-results/test
            core/build/reports/tests/test
          if-no-files-found: error

  dotnet-sdks:
    name: .NET exact / SDK ${{ matrix.dotnet-sdk }}
    needs: [scope]
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dotnet-sdk: ["8.0.425", "9.0.318"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet-sdk }}

      - name: Run .NET exact fixtures
        run: >-
          scripts/run_gradle.sh :core:test
          --tests '*DotnetCliConformanceTest*'
          -Paffected.cliConformance=true
          --rerun-tasks --no-daemon --no-parallel --max-workers=1

  phpunit-versions:
    name: PHPUnit exact / ${{ matrix.phpunit }}
    needs: [scope]
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            phpunit: "11.5.56"
          - php: "8.3"
            phpunit: "12.5.37"
          - php: "8.4"
            phpunit: "13.2.6"
          - php: "8.4"
            phpunit: "13.3.6"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, xml, xmlwriter
          tools: composer:2.10.3
          coverage: none
      - name: Run PHPUnit conformance
        run: >-
          scripts/run_gradle.sh :core:test
          --tests '*CliAdapterConformanceTest*PHPUnit*'
          -Paffected.cliConformance=true
          -Daffected.phpunitVersion=${{ matrix.phpunit }}
          --rerun-tasks --no-daemon --no-parallel --max-workers=1

  required:
    name: exact-impact
    if: ${{ always() }}
    needs: [scope, exact-impact, cross-platform-paths, cli-native, dotnet-sdks, phpunit-versions]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every exact-impact lane
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          EXACT_REQUIRED: ${{ needs.scope.outputs.exact }}
          NATIVE_REQUIRED: ${{ needs.scope.outputs.native }}
          EXACT_RESULT: ${{ needs.exact-impact.result }}
          PATHS_RESULT: ${{ needs.cross-platform-paths.result }}
          CLI_RESULT: ${{ needs.cli-native.result }}
          DOTNET_RESULT: ${{ needs.dotnet-sdks.result }}
          PHPUNIT_RESULT: ${{ needs.phpunit-versions.result }}
        run: |
          set -euo pipefail
          failed=0
          require_success() {
            local name=$1 result=$2
            if [ "$result" != success ]; then
              echo "::error::Required job $name finished as $result."
              failed=1
            fi
          }
          require_when() {
            local name=$1 required=$2 result=$3
            if [ "$required" = false ]; then
              if [ "$result" = success ] || [ "$result" = skipped ]; then
                return
              fi
              echo "::error::Optional job $name finished as $result."
              failed=1
              return
            fi
            require_success "$name" "$result"
          }
          require_success scope "$SCOPE_RESULT"
          require_when exact-impact "${EXACT_REQUIRED:-true}" "$EXACT_RESULT"
          require_when cross-platform-paths "${NATIVE_REQUIRED:-true}" "$PATHS_RESULT"
          require_when cli-native "${NATIVE_REQUIRED:-true}" "$CLI_RESULT"
          require_when dotnet-sdks "${NATIVE_REQUIRED:-true}" "$DOTNET_RESULT"
          require_when phpunit-versions "${NATIVE_REQUIRED:-true}" "$PHPUNIT_RESULT"
          exit "$failed"

  report:
    name: Report scheduled failure
    needs: [required]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Scheduled exact-impact conformance failed"
        run: |
          set -euo pipefail
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "The scheduled run failed: $RUN_URL"
          fi
