name: Exact-impact conformance

on:
  pull_request:
    paths:
      - ".github/workflows/conformance.yml"
      - "config/support-matrix.json"
      - "collector/**"
      - "conformance/**"
      - "core/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "scripts/support_matrix.py"
      - "scripts/tests/test_support_matrix.py"
      - "docs/SUPPORT.md"
      - "src/main/resources/META-INF/plugin.xml"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-impact:
    name: ${{ matrix.os }} / JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: "17"
            gradle8: "true"
            symlinks: required
          - os: ubuntu-latest
            java: "26"
            gradle8: "false"
            symlinks: required
          - os: macos-latest
            java: "21"
            gradle8: "true"
            symlinks: required
          - os: windows-latest
            java: "21"
            gradle8: "true"
            symlinks: optional
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0

      - name: Run exact-impact fixtures
        shell: bash
        run: |
          scripts/run_gradle.sh :collector:test \
            --tests com.aspix2k.affected.collector.AffectedDependencySelectorTest \
            --tests com.aspix2k.affected.collector.AffectedMavenConfigTest \
            --tests com.aspix2k.affected.collector.CollectorContractTest \
            --tests com.aspix2k.affected.collector.GradleInjectionTest \
            --tests com.aspix2k.affected.collector.MavenInjectionTest \
            -Paffected.conformance=true \
            -Paffected.test.javaVersion=${{ matrix.java }} \
            -Paffected.test.gradle8=${{ matrix.gradle8 }} \
            -Paffected.test.symlinkMode=${{ matrix.symlinks }} \
            --rerun-tasks --no-daemon --no-parallel --max-workers=1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: exact-impact-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            collector/build/test-results/test
            collector/build/reports/tests/test
            collector/build/reports/exact-impact-conformance
          if-no-files-found: error

  cross-platform-paths:
    name: Cross-platform paths / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0

      - name: Run platform-specific core tests
        shell: bash
        run: >-
          scripts/run_gradle.sh :core:test
          --tests com.aspix2k.affected.CrossPlatformPathTest
          --tests com.aspix2k.affected.build.XcodeNativeTest
          -Paffected.cliConformance=true
          --rerun-tasks --no-daemon --no-parallel --max-workers=1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cross-platform-paths-${{ matrix.os }}
          path: |
            core/build/test-results/test
            core/build/reports/tests/test
          if-no-files-found: warn

  cli-native:
    name: CLI native fixtures / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_NEXTEST_VERSION: "0.9.143"
      CARGO_NEXTEST_SHA256: "66786b9abe23920d022a182d1416b1bbc8130dd4872a9553d76985a1708dcd1e"
      BAZELISK_VERSION: "1.29.0"
      BAZELISK_SHA256: "5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992"
      SQLC_VERSION: "1.31.1"
      SQLC_SHA256: "497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: sbt/setup-sbt@8feba82adc7f01ddcf8165b86f778bdb5b82cebc # v1.5.7
      - uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.7.0"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.400"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.1"
      - name: Install cargo-nextest
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CARGO_NEXTEST_VERSION" =~ ^0\.9\.[0-9]+$ ]]
          [[ "$CARGO_NEXTEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          archive="$RUNNER_TEMP/cargo-nextest.tar.gz"
          destination="$RUNNER_TEMP/cargo-nextest-bin"
          url="https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$CARGO_NEXTEST_VERSION/cargo-nextest-$CARGO_NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          curl -q --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 120 --max-filesize 33554432 \
            --retry 3 --retry-all-errors \
            --output "$archive" "$url"
          printf '%s  %s\n' "$CARGO_NEXTEST_SHA256" "$archive" | sha256sum --check --strict
          [[ "$(tar -tzf "$archive")" == "cargo-nextest" ]]
          [[ "$(tar -tvzf "$archive" | cut -c1)" == "-" ]]
          install -d -m 0700 "$destination"
          tar -xzf "$archive" --no-same-owner --no-same-permissions -C "$destination"
          [[ -f "$destination/cargo-nextest" && ! -L "$destination/cargo-nextest" ]]
          chmod 0755 "$destination/cargo-nextest"
          [[ "$("$destination/cargo-nextest" --version)" == "cargo-nextest $CARGO_NEXTEST_VERSION "* ]]
          printf '%s\n' "$destination" >> "$GITHUB_PATH"
      - name: Install Bazelisk
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BAZELISK_VERSION" =~ ^1\.[0-9]+\.[0-9]+$ ]]
          [[ "$BAZELISK_SHA256" =~ ^[0-9a-f]{64}$ ]]
          binary="$RUNNER_TEMP/bazelisk"
          destination="$RUNNER_TEMP/bazelisk-bin"
          url="https://github.com/bazelbuild/bazelisk/releases/download/v$BAZELISK_VERSION/bazelisk-linux-amd64"
          curl -q --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 120 --max-filesize 33554432 \
            --retry 3 --retry-all-errors \
            --output "$binary" "$url"
          printf '%s  %s\n' "$BAZELISK_SHA256" "$binary" | sha256sum --check --strict
          install -d -m 0700 "$destination"
          install -m 0755 "$binary" "$destination/bazelisk"
          ln -s bazelisk "$destination/bazel"
          [[ -x "$destination/bazelisk" && -x "$destination/bazel" ]]
          printf '%s\n' "$destination" >> "$GITHUB_PATH"
      - name: Install sqlc
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SQLC_VERSION" =~ ^1\.[0-9]+\.[0-9]+$ ]]
          [[ "$SQLC_SHA256" =~ ^[0-9a-f]{64}$ ]]
          archive="$RUNNER_TEMP/sqlc.tar.gz"
          destination="$RUNNER_TEMP/sqlc-bin"
          url="https://github.com/sqlc-dev/sqlc/releases/download/v$SQLC_VERSION/sqlc_${SQLC_VERSION}_linux_amd64.tar.gz"
          curl -q --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 120 --max-filesize 33554432 \
            --retry 3 --retry-all-errors \
            --output "$archive" "$url"
          printf '%s  %s\n' "$SQLC_SHA256" "$archive" | sha256sum --check --strict
          [[ "$(tar -tzf "$archive")" == "sqlc" ]]
          [[ "$(tar -tvzf "$archive" | cut -c1)" == "-" ]]
          install -d -m 0700 "$destination"
          tar -xzf "$archive" --no-same-owner --no-same-permissions -C "$destination"
          [[ -f "$destination/sqlc" && ! -L "$destination/sqlc" ]]
          chmod 0755 "$destination/sqlc"
          [[ "$("$destination/sqlc" version)" == "v$SQLC_VERSION" ]]
          printf '%s\n' "$destination" >> "$GITHUB_PATH"
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # master
        with:
          ruby-version: "4.0.6"
          bundler: "4.0.18"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5.9"
          extensions: dom, mbstring, xml, xmlwriter
          tools: composer:2.10.2
          coverage: none
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: "3.13.0"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.0"
          channel: stable

      - name: Install native fixture tools
        run: |
          python -m pip install cmake==4.4.2 pytest==9.1.1 ruff==0.16.3
          sudo apt-get update
          sudo apt-get install -y ant ant-optional meson ninja-build gcc make r-base r-cran-testthat

      - name: Check Python adapter
        run: |
          python -m ruff check core/src/main/python/affected_pytest.py
          python -m ruff format --check core/src/main/python/affected_pytest.py

      - name: Run native CLI fixtures
        run: >-
          scripts/run_gradle.sh :core:test
          --tests '*Cli*ConformanceTest'
          -Paffected.cliConformance=true
          --rerun-tasks --no-daemon --no-parallel --max-workers=1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cli-native-linux
          path: |
            core/build/test-results/test
            core/build/reports/tests/test
          if-no-files-found: error

  dotnet-sdks:
    name: .NET exact / SDK ${{ matrix.dotnet-sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dotnet-sdk: ["8.0.424", "9.0.317"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ matrix.dotnet-sdk }}

      - name: Run .NET exact fixtures
        run: >-
          scripts/run_gradle.sh :core:test
          --tests '*DotnetCliConformanceTest*'
          -Paffected.cliConformance=true
          --rerun-tasks --no-daemon --no-parallel --max-workers=1

  phpunit-versions:
    name: PHPUnit exact / ${{ matrix.phpunit }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            phpunit: "11.5.56"
          - php: "8.3"
            phpunit: "12.5.33"
          - php: "8.4"
            phpunit: "13.2.6"
          - php: "8.4"
            phpunit: "13.3.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, xml, xmlwriter
          tools: composer:2.10.2
          coverage: none
      - name: Run PHPUnit conformance
        run: >-
          scripts/run_gradle.sh :core:test
          --tests '*CliAdapterConformanceTest*PHPUnit*'
          -Paffected.cliConformance=true
          -Daffected.phpunitVersion=${{ matrix.phpunit }}
          --rerun-tasks --no-daemon --no-parallel --max-workers=1
