name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4.3.1

      - name: Match plugin version to tag
        run: |
          version=$(./gradlew -q printVersion)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin version $version" >&2
            exit 1
          fi

      - name: Read release notes from the changelog
        id: notes
        run: |
          notes=$(.github/changelog-section.sh "${GITHUB_REF_NAME#v}")
          {
            echo 'body<<CHANGELOG_EOF'
            echo "$notes"
            echo CHANGELOG_EOF
          } >> "$GITHUB_OUTPUT"

      - run: ./gradlew test
      - run: ./gradlew buildPlugin
      - run: ./gradlew verifyPlugin

      - name: Name the asset apart from the source archives
        run: |
          # GitHub attaches its own "Source code (zip)" named after the tag. It collides
          # with the plugin zip on the release page, and uploading the wrong one to the
          # marketplace fails with "Unexpected plugin archive file structure".
          # Copy, never move: publishPlugin reads the artifact from its original path.
          cp build/distributions/affected-*.zip "affected-plugin-${GITHUB_REF_NAME#v}.zip"

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: affected-plugin-*.zip
          body: ${{ steps.notes.outputs.body }}
          fail_on_unmatched_files: true

      - name: Publish to JetBrains Marketplace
        if: ${{ env.PUBLISH_TOKEN != '' }}
        run: |
          id=$(curl -sf "https://plugins.jetbrains.com/api/plugins/intellij/com.aspix2k.affected" | jq -r '.id // empty')
          if [ -z "$id" ]; then
            echo "::notice::The plugin is not on the marketplace yet. The first version has to be uploaded through the web form; later tags publish from here."
            exit 0
          fi
          published=$(curl -sf "https://plugins.jetbrains.com/api/plugins/$id/updates" | jq -r --arg v "${GITHUB_REF_NAME#v}" 'map(select(.version == $v)) | length')
          if [ "$published" != "0" ]; then
            echo "::notice::Version ${GITHUB_REF_NAME#v} is already on the marketplace."
            exit 0
          fi
          ./gradlew publishPlugin

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: release-reports
          path: |
            build/reports/tests
            build/reports/pluginVerifier
          if-no-files-found: warn
