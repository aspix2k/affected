name: Dependency graph

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dependencies: ${{ steps.classify.outputs.dependencies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        run: python3 scripts/ci_scope.py --github-output "$GITHUB_OUTPUT"

  generate:
    needs: [scope]
    if: github.event_name == 'push' || needs.scope.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Free disk space for dependency resolution
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Fetch the Gradle distribution
        run: scripts/run_gradle.sh --version

      - uses: gradle/actions/dependency-submission@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
        with:
          dependency-graph: generate-and-upload
          dependency-graph-report-dir: dependency-graph-reports
          dependency-graph-continue-on-failure: false
          additional-arguments: --no-daemon --no-parallel --max-workers=1
          cache-disabled: true
          validate-wrappers: true
          artifact-retention-days: 1
          add-job-summary: on-failure

      - name: Require a complete dependency snapshot
        env:
          EXPECTED_DEPENDENCY_CORRELATOR: dependency_graph-generate
          EXPECTED_DEPENDENCY_JOB: ${{ github.run_id }}
          EXPECTED_DEPENDENCY_REF: ${{ github.ref }}
          EXPECTED_DEPENDENCY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/quality.sh dependency-graph dependency-graph-reports
