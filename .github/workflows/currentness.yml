name: Release currentness

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  currentness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - name: Require current release pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/time --verbose python3 scripts/release_currentness.py --report "$RUNNER_TEMP/currentness-report.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: currentness-report
          path: ${{ runner.temp }}/currentness-report.txt
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Report scheduled failure
    needs: [currentness]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: currentness-report
          path: report
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Scheduled release currentness failed"
          HINT: "Apply the mechanical updates locally with `python3 scripts/release_currentness.py --write`, review the diff and open a pull request."
        run: |
          set -euo pipefail
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
          lead="The scheduled run failed"
          if [ -n "$number" ]; then lead="Failed again"; fi
          body=$RUNNER_TEMP/issue-body.md
          {
            printf '%s: %s\n' "$lead" "$RUN_URL"
            if [ -s report/currentness-report.txt ]; then
              printf '\n~~~~text\n'
              head -c 60000 report/currentness-report.txt
              printf '\n~~~~\n\n'
              printf '%s\n' "$HINT"
            fi
          } > "$body"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
          else
            gh issue create --title "$TITLE" --body-file "$body"
          fi
