name: CodeQL

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
          ram: 4096
          threads: 2

      - name: Free disk space for the downloaded IDE
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Build every Java and Kotlin source set
        run: >-
          /usr/bin/time --verbose
          ./gradlew --no-daemon --no-build-cache --no-parallel --max-workers=1
          clean classes :core:classes :mcp:classes :collector:classes :collector:mavenClasses

      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          upload: never
          upload-database: false
          post-processed-sarif-path: codeql-sarif

      - name: Require zero CodeQL findings
        run: scripts/quality.sh codeql codeql-sarif

  main:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
          ram: 4096
          threads: 2

      - name: Free disk space for the downloaded IDE
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Build every Java and Kotlin source set
        run: >-
          /usr/bin/time --verbose
          ./gradlew --no-daemon --no-build-cache --no-parallel --max-workers=1
          clean classes :core:classes :mcp:classes :collector:classes :collector:mavenClasses

      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          upload: always
          upload-database: false
          post-processed-sarif-path: codeql-sarif

      - name: Require zero CodeQL findings
        run: scripts/quality.sh codeql codeql-sarif
