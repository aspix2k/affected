name: CodeQL

on:
  pull_request:
  merge_group:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: python3 scripts/ci_scope.py --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: steps.scope.outputs.codeql == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
        if: steps.scope.outputs.codeql == 'true'
      - name: Verify Kotlin compatibility shim
        if: steps.scope.outputs.codeql == 'true'
        run: python3 scripts/codeql_kotlin_compat_probe.py

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: steps.scope.outputs.codeql == 'true'
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
          ram: 4096
          threads: 2

      - name: Free disk space for the downloaded IDE
        if: steps.scope.outputs.codeql == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Build every Java and Kotlin source set
        if: steps.scope.outputs.codeql == 'true'
        run: >-
          /usr/bin/time --verbose
          scripts/run_gradle.sh
          --init-script scripts/codeql-kotlin-compat.init.gradle
          -Paffected.codeql.kotlinPluginVersion=2.4.10
          --no-daemon --no-build-cache --no-parallel --max-workers=1
          clean classes :core:classes :mcp:classes :collector:classes :collector:mavenClasses

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: steps.scope.outputs.codeql == 'true'
        with:
          upload: never
          upload-database: false
          post-processed-sarif-path: codeql-sarif

      - name: Require zero CodeQL findings
        if: steps.scope.outputs.codeql == 'true'
        run: scripts/quality.sh codeql codeql-sarif

  main:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: python3 scripts/ci_scope.py --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: steps.scope.outputs.codeql == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
        if: steps.scope.outputs.codeql == 'true'
      - name: Verify Kotlin compatibility shim
        if: steps.scope.outputs.codeql == 'true'
        run: python3 scripts/codeql_kotlin_compat_probe.py

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: steps.scope.outputs.codeql == 'true'
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
          ram: 4096
          threads: 2

      - name: Free disk space for the downloaded IDE
        if: steps.scope.outputs.codeql == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - name: Build every Java and Kotlin source set
        if: steps.scope.outputs.codeql == 'true'
        run: >-
          /usr/bin/time --verbose
          scripts/run_gradle.sh
          --init-script scripts/codeql-kotlin-compat.init.gradle
          -Paffected.codeql.kotlinPluginVersion=2.4.10
          --no-daemon --no-build-cache --no-parallel --max-workers=1
          clean classes :core:classes :mcp:classes :collector:classes :collector:mavenClasses

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: steps.scope.outputs.codeql == 'true'
        with:
          upload: always
          upload-database: false
          post-processed-sarif-path: codeql-sarif

      - name: Require zero CodeQL findings
        if: steps.scope.outputs.codeql == 'true'
        run: scripts/quality.sh codeql codeql-sarif
