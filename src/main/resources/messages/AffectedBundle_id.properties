doctor.git-unavailable.message=Direktori proyek {0} bukan repositori git, atau git tidak dapat dijalankan.
doctor.git-unavailable.remedy=Buka proyek di dalam repositori git dan pastikan git ada di PATH IDE.
doctor.base-resolved.message=Perubahan dibandingkan dengan {0}.
doctor.base-unresolved.message=Basis perbandingan tidak ditemukan: {0} dan cabang cadangan tidak ada, baik secara lokal maupun di origin.
doctor.base-unresolved.remedy=Ambil cabang dasar dari origin, atau tetapkan cabang dasar yang ada.
doctor.build-system-not-imported.message=Ada berkas build {0} di proyek, tetapi proyek belum diimpor di IDE.
doctor.build-system-not-imported.remedy=Impor atau tautkan proyek di IDE agar Affected dapat membaca modulnya.
doctor.no-build-system.message=Tidak ada sistem build yang didukung yang terdeteksi di proyek ini.
doctor.no-build-system.remedy=Buka akar proyek yang berisi berkas build seperti settings.gradle.kts, pom.xml, atau Cargo.toml.
doctor.build-systems.message=Sistem build yang ditemukan (id, modul / akar): {0}.
doctor.tools-missing.message=Alat berikut tidak ditemukan di PATH IDE: {0}.
doctor.tools-missing.remedy=Instal alat tersebut, atau jalankan IDE dari shell yang PATH-nya memuat alat itu.
doctor.tools-ready.message=Alat yang ditemukan di PATH IDE: {0}.
doctor.nested-roots-capped.message=Pencarian akar build bersarang mencapai batasnya (paling banyak {0} akar) dan mungkin melewatkan beberapa.
doctor.nested-roots-capped.remedy=Buka subproyek tertentu yang Anda kerjakan agar lebih sedikit direktori yang dipindai.
doctor.modules-over-budget.message=Analisis menemukan lebih dari {0} modul terdampak dan dibuang.
doctor.modules-over-budget.remedy=Persempit perubahan, atau bandingkan dengan cabang dasar yang lebih dekat.
doctor.changes-found.message=Berkas yang diubah: {0}.
doctor.changes-unresolved.message={0} berkas yang diubah tidak dimiliki modul mana pun yang dapat diverifikasi, misalnya {1}.
doctor.changes-unresolved.remedy=Tambahkan berkas ke modul build yang punya tes atau tugas kompilasi, lalu jalankan Affected lagi.
doctor.changes-uncovered.message={0} berkas kode yang diubah tidak termasuk sistem build yang terdeteksi dan tidak diperiksa, misalnya {1}.
doctor.changes-uncovered.remedy=Tambahkan berkas build untuk bahasa itu, atau periksa berkas tersebut secara manual.
doctor.analysis-analyzing.message=Affected masih menganalisis revisi saat ini.
doctor.analysis-analyzing.remedy=Tunggu sebentar lalu jalankan diagnosis lagi.
doctor.analysis-unavailable.message=Analisis gagal dan tidak ada hasil.
doctor.analysis-unavailable.remedy=Periksa log IDE untuk peringatan Affected, lalu ubah satu berkas atau segarkan untuk mencoba lagi.
doctor.analysis-ready.message=Analisis siap.
doctor.ide-busy.message=IDE sedang mengindeks atau mengimpor proyek.
doctor.ide-busy.remedy=Tunggu hingga tugas latar belakang selesai, lalu jalankan Affected.
