doctor.git-unavailable.message=プロジェクトディレクトリ {0} は git リポジトリではないか、git を起動できません。
doctor.git-unavailable.remedy=git リポジトリ内のプロジェクトを開き、git が IDE の PATH にあることを確認してください。
doctor.base-resolved.message=変更は {0} と比較されています。
doctor.base-unresolved.message=比較の基準が見つかりません。{0} とフォールバックのブランチは、ローカルにも origin にも存在しません。
doctor.base-unresolved.remedy=origin からベースブランチを取得するか、存在するベースブランチを設定してください。
doctor.build-system-not-imported.message=プロジェクトに {0} のビルドファイルがありますが、プロジェクトは IDE にインポートされていません。
doctor.build-system-not-imported.remedy=Affected がモジュールを読み取れるよう、IDE でプロジェクトをインポートまたはリンクしてください。
doctor.no-build-system.message=このプロジェクトでは、サポートされているビルドシステムが検出されませんでした。
doctor.no-build-system.remedy=settings.gradle.kts、pom.xml、Cargo.toml などのビルドファイルがあるプロジェクトのルートを開いてください。
doctor.build-systems.message=検出されたビルドシステム (ID、モジュール / ルート): {0}。
doctor.tools-missing.message=次のツールが IDE の PATH で見つかりません: {0}。
doctor.tools-missing.remedy=インストールするか、PATH に含まれているシェルから IDE を起動してください。
doctor.tools-ready.message=IDE の PATH で見つかったツール: {0}。
doctor.nested-roots-capped.message=入れ子のビルドルートの探索が上限 (最大 {0} ルート) に達し、一部を見逃した可能性があります。
doctor.nested-roots-capped.remedy=走査するディレクトリを減らすため、作業中のサブプロジェクトを開いてください。
doctor.modules-over-budget.message=解析で {0} を超える影響モジュールが見つかったため、結果は破棄されました。
doctor.modules-over-budget.remedy=変更を絞るか、より近いベースブランチと比較してください。
doctor.changes-found.message=変更されたファイル: {0}。
doctor.changes-unresolved.message=変更された {0} 個のファイルは、検証できるモジュールに属していません (例: {1})。
doctor.changes-unresolved.remedy=テストまたはコンパイルタスクを持つビルドモジュールにファイルを追加し、Affected を再実行してください。
doctor.changes-uncovered.message=変更された {0} 個のコードファイルは、検出されたどのビルドシステムにも属しておらずチェックされません (例: {1})。
doctor.changes-uncovered.remedy=その言語のビルドファイルを追加するか、これらのファイルを手動で確認してください。
doctor.analysis-analyzing.message=Affected は現在のリビジョンをまだ解析中です。
doctor.analysis-analyzing.remedy=少し待ってからもう一度診断してください。
doctor.analysis-unavailable.message=解析に失敗し、結果がありません。
doctor.analysis-unavailable.remedy=IDE のログで Affected の警告を確認し、ファイルを変更するか更新して再試行してください。
doctor.analysis-ready.message=解析の準備ができています。
doctor.ide-busy.message=IDE がプロジェクトをインデックス中、またはインポート中です。
doctor.ide-busy.remedy=バックグラウンドタスクが終わるまで待ってから Affected を実行してください。
