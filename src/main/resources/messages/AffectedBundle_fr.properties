doctor.git-unavailable.message=Le répertoire du projet {0} n’est pas un dépôt git, ou git ne peut pas être lancé.
doctor.git-unavailable.remedy=Ouvrez un projet à l’intérieur d’un dépôt git et vérifiez que git est dans le PATH de l’IDE.
doctor.base-resolved.message=Les changements sont comparés à {0}.
doctor.base-unresolved.message=Aucune base de comparaison trouvée : {0} et les branches de repli n’existent ni en local ni sur origin.
doctor.base-unresolved.remedy=Récupérez la branche de base depuis origin ou définissez une branche de base existante.
doctor.build-system-not-imported.message=Des fichiers de build {0} existent dans le projet, mais celui-ci n’est pas importé dans l’IDE.
doctor.build-system-not-imported.remedy=Importez ou liez le projet dans l’IDE pour qu’Affected puisse lire ses modules.
doctor.no-build-system.message=Aucun système de build pris en charge n’a été détecté dans ce projet.
doctor.no-build-system.remedy=Ouvrez la racine du projet qui contient un fichier de build comme settings.gradle.kts, pom.xml ou Cargo.toml.
doctor.build-systems.message=Systèmes de build trouvés (id, modules / racines) : {0}.
doctor.tools-missing.message=Ces outils sont introuvables dans le PATH de l’IDE : {0}.
doctor.tools-missing.remedy=Installez-les, ou lancez l’IDE depuis un shell où ils sont dans le PATH.
doctor.tools-ready.message=Outils trouvés dans le PATH de l’IDE : {0}.
doctor.nested-roots-capped.message=La recherche des racines de build imbriquées a atteint sa limite ({0} racines au maximum) et a pu en ignorer.
doctor.nested-roots-capped.remedy=Ouvrez le sous-projet précis sur lequel vous travaillez pour parcourir moins de répertoires.
doctor.modules-over-budget.message=L’analyse a trouvé plus de {0} modules impactés et a été abandonnée.
doctor.modules-over-budget.remedy=Réduisez le changement ou comparez avec une branche de base plus proche.
doctor.changes-found.message=Fichiers modifiés : {0}.
doctor.changes-unresolved.message={0} fichiers modifiés n’appartiennent à aucun module vérifiable, par exemple {1}.
doctor.changes-unresolved.remedy=Ajoutez les fichiers à un module de build avec des tests ou une tâche de compilation, puis relancez Affected.
doctor.changes-uncovered.message={0} fichiers de code modifiés n’appartiennent à aucun système de build détecté et ne sont pas vérifiés, par exemple {1}.
doctor.changes-uncovered.remedy=Ajoutez le fichier de build de ce langage, ou vérifiez ces fichiers à la main.
doctor.analysis-analyzing.message=Affected analyse encore la révision actuelle.
doctor.analysis-analyzing.remedy=Patientez un instant et relancez le diagnostic.
doctor.analysis-unavailable.message=L’analyse a échoué et aucun résultat n’est disponible.
doctor.analysis-unavailable.remedy=Consultez le journal de l’IDE pour les avertissements d’Affected, puis modifiez un fichier ou actualisez pour réessayer.
doctor.analysis-ready.message=L’analyse est prête.
doctor.ide-busy.message=L’IDE indexe ou importe un projet.
doctor.ide-busy.remedy=Attendez la fin des tâches en arrière-plan, puis lancez Affected.
