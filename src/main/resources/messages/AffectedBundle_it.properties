doctor.git-unavailable.message=La directory del progetto {0} non è un repository git, oppure git non può essere avviato.
doctor.git-unavailable.remedy=Apri un progetto all’interno di un repository git e assicurati che git sia nel PATH dell’IDE.
doctor.base-resolved.message=Le modifiche vengono confrontate con {0}.
doctor.base-unresolved.message=Nessuna base di confronto trovata: {0} e i rami di riserva non esistono né in locale né su origin.
doctor.base-unresolved.remedy=Scarica il ramo di base da origin oppure imposta un ramo di base esistente.
doctor.build-system-not-imported.message=Nel progetto esistono file di build {0}, ma il progetto non è importato nell’IDE.
doctor.build-system-not-imported.remedy=Importa o collega il progetto nell’IDE così che Affected possa leggerne i moduli.
doctor.no-build-system.message=In questo progetto non è stato rilevato alcun sistema di build supportato.
doctor.no-build-system.remedy=Apri la radice del progetto che contiene un file di build come settings.gradle.kts, pom.xml o Cargo.toml.
doctor.build-systems.message=Sistemi di build trovati (id, moduli / radici): {0}.
doctor.tools-missing.message=Questi strumenti non sono stati trovati nel PATH dell’IDE: {0}.
doctor.tools-missing.remedy=Installali, oppure avvia l’IDE da una shell in cui sono nel PATH.
doctor.tools-ready.message=Strumenti trovati nel PATH dell’IDE: {0}.
doctor.nested-roots-capped.message=La ricerca delle radici di build annidate ha raggiunto il limite (al massimo {0} radici) e potrebbe averne saltate alcune.
doctor.nested-roots-capped.remedy=Apri il sottoprogetto specifico su cui lavori, così vengono scansionate meno directory.
doctor.modules-over-budget.message=L’analisi ha trovato più di {0} moduli interessati ed è stata scartata.
doctor.modules-over-budget.remedy=Restringi la modifica oppure confronta con un ramo di base più vicino.
doctor.changes-found.message=File modificati: {0}.
doctor.changes-unresolved.message={0} file modificati non appartengono a nessun modulo verificabile, ad esempio {1}.
doctor.changes-unresolved.remedy=Aggiungi i file a un modulo di build con test o un task di compilazione, poi esegui di nuovo Affected.
doctor.changes-uncovered.message={0} file di codice modificati non appartengono a nessun sistema di build rilevato e non sono controllati, ad esempio {1}.
doctor.changes-uncovered.remedy=Aggiungi il file di build per quel linguaggio, oppure controlla i file a mano.
doctor.analysis-analyzing.message=Affected sta ancora analizzando la revisione corrente.
doctor.analysis-analyzing.remedy=Attendi un momento ed esegui di nuovo la diagnostica.
doctor.analysis-unavailable.message=L’analisi è fallita e non c’è alcun risultato.
doctor.analysis-unavailable.remedy=Controlla il log dell’IDE per gli avvisi di Affected, poi modifica un file o aggiorna per riprovare.
doctor.analysis-ready.message=L’analisi è pronta.
doctor.ide-busy.message=L’IDE sta indicizzando o importando un progetto.
doctor.ide-busy.remedy=Attendi che le attività in background terminino, poi esegui Affected.
