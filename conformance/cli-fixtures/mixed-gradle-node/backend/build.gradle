tasks.register("test") {
    doLast {
        file("affected-gradle-test.marker").setText("executed\n", "UTF-8")
    }
}

tasks.register("failingTest") {
    doLast {
        file("affected-gradle-failure.marker").setText("executed\n", "UTF-8")
        throw new GradleException("requested mixed-run failure")
    }
}
