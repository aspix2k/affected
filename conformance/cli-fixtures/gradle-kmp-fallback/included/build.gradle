tasks.register("includedTest") {
    doLast {
        def configured = System.getProperty("affected.kmp.markers")
        if (configured == null || configured.trim().isEmpty()) {
            throw new GradleException("affected.kmp.markers is required")
        }
        def directory = new File(configured)
        try {
            java.nio.file.Files.createDirectories(directory.toPath())
        } catch (IOException failure) {
            throw new GradleException("Cannot create marker directory", failure)
        }
        new File(directory, "included.marker").setText("included\n", "UTF-8")
    }
}
